<!-- PARTIAL: LANGUAGE MODAL -->
<!-- ========================================= -->
<div class="modal fade" id="languageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" data-i18n="select_language">Select Language</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary lang-option" data-lang="en" data-bs-dismiss="modal">
                        🇬🇧 English
                    </button>
                    <button class="btn btn-outline-primary lang-option" data-lang="ur" data-bs-dismiss="modal">
                        🇵🇰 اردو
                    </button>
                    <button class="btn btn-outline-primary lang-option" data-lang="ps" data-bs-dismiss="modal">
                        🇦🇫 پښتو
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
