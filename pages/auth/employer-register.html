<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Registration - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 p-4">
                        <h2 class="text-center fw-bold mb-2" data-i18n="register">Employer Registration</h2>
                        <p class="text-center text-muted small mb-4">Step <span id="stepNum">1</span> of 4</p>

                        <!-- Progress Bar -->
                        <div class="step-progress mb-4">
                            <div class="progress-bar" id="stepProgress" style="width: 0%;" role="progressbar"></div>
                        </div>

                        <form id="employerRegisterForm" novalidate>
                            <!-- Step 1: Account Info -->
                            <div class="step-content" data-step="1">
                                <h5 class="fw-bold">Step 1: Account Information</h5>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" data-i18n="full_name">Full Name</label>
                                    <input type="text" class="form-control" placeholder="John Doe" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control" placeholder="your@email.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" data-i18n="phone">Phone</label>
                                    <input type="tel" class="form-control" placeholder="+92 300 1234567" required>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Password</label>
                                        <input type="password" class="form-control" placeholder="Min 8 chars" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Confirm Password</label>
                                        <input type="password" class="form-control" placeholder="Re-enter password" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Step 2: Personal Info -->
                            <div class="step-content" data-step="2" style="display:none;">
                                <h5 class="fw-bold">Step 2: Personal Information</h5>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Gender</label>
                                        <select class="form-select" required>
                                            <option value="">Select</option>
                                            <option>Male</option>
                                            <option>Female</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Date of Birth</label>
                                        <input type="date" class="form-control" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">CNIC / ID</label>
                                    <input type="text" class="form-control" placeholder="12345-1234567-1" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Address</label>
                                    <input type="text" class="form-control" placeholder="House #, Street" required>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">City</label>
                                        <input type="text" class="form-control" placeholder="Karachi" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Area</label>
                                        <input type="text" class="form-control" placeholder="Gulshan" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Step 3: Requirement -->
                            <div class="step-content" data-step="3" style="display:none;">
                                <h5 class="fw-bold">Step 3: Requirements</h5>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Required Service</label>
                                    <select class="form-select" required>
                                        <option value="">Select</option>
                                        <option>Cleaner</option>
                                        <option>Maid</option>
                                        <option>Cook</option>
                                        <option>Babysitter</option>
                                        <option>Driver</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Employment Type</label>
                                    <select class="form-select" required>
                                        <option>Full-time</option>
                                        <option>Part-time</option>
                                        <option>Live-in</option>
                                        <option>Live-out</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Salary / Budget</label>
                                        <input type="number" class="form-control" placeholder="PKR 25000" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Start Date</label>
                                        <input type="date" class="form-control" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Working Hours</label>
                                    <input type="text" class="form-control" placeholder="e.g. 9am - 5pm">
                                </div>
                            </div>

                            <!-- Step 4: Confirmation -->
                            <div class="step-content" data-step="4" style="display:none;">
                                <h5 class="fw-bold">Step 4: Confirmation</h5>
                                <p class="text-muted">Please review your information before submitting.</p>
                                <div class="alert alert-info">All your details are correct? Click Submit to complete registration.</div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                    <label class="form-check-label" for="termsCheck">I agree to the <a href="#">Terms & Conditions</a></label>
                                </div>
                            </div>

                            <!-- Navigation Buttons -->
                            <div class="d-flex justify-content-between mt-4">
                                <button type="button" class="btn btn-outline-secondary step-prev" style="display:none;" data-i18n="previous">Previous</button>
                                <button type="button" class="btn btn-primary step-next ms-auto" data-i18n="next">Next</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/auth.js"></script>
</body>
</html>
