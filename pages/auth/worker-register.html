<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Registration - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="card shadow-sm border-0 p-4">
                        <h2 class="text-center fw-bold mb-2">Worker Registration</h2>
                        <p class="text-center text-muted small mb-4">Complete your biodata to get verified</p>

                        <form id="workerRegisterForm" novalidate>
                            <!-- Basic Info -->
                            <h5 class="fw-bold mt-3">Personal Information</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold" data-i18n="full_name">Full Name</label>
                                    <input type="text" class="form-control" placeholder="Muhammad Ali" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Father / Husband Name</label>
                                    <input type="text" class="form-control" placeholder="Father's name" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Gender</label>
                                    <select class="form-select" required>
                                        <option value="">Select</option>
                                        <option>Male</option>
                                        <option>Female</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Date of Birth</label>
                                    <input type="date" class="form-control" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold" data-i18n="phone">Phone</label>
                                    <input type="tel" class="form-control" placeholder="+92 300 1234567" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">WhatsApp</label>
                                <input type="tel" class="form-control" placeholder="+92 300 1234567">
                            </div>

                            <!-- Identity -->
                            <h5 class="fw-bold mt-4">Identity Information</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">CNIC / ID Number</label>
                                    <input type="text" class="form-control" placeholder="12345-1234567-1" required>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label fw-semibold">ID Front</label>
                                    <input type="file" class="form-control" accept="image/*,.pdf" required>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label fw-semibold">ID Back</label>
                                    <input type="file" class="form-control" accept="image/*,.pdf" required>
                                </div>
                            </div>

                            <!-- Address -->
                            <h5 class="fw-bold mt-4">Address</h5>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Country</label>
                                    <input type="text" class="form-control" value="Pakistan" readonly>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Province</label>
                                    <input type="text" class="form-control" placeholder="Sindh" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">City</label>
                                    <input type="text" class="form-control" placeholder="Karachi" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Area</label>
                                    <input type="text" class="form-control" placeholder="Gulshan" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Complete Address</label>
                                    <input type="text" class="form-control" placeholder="House #, Street" required>
                                </div>
                            </div>

                            <!-- Professional -->
                            <h5 class="fw-bold mt-4">Professional Information</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Service Category</label>
                                    <select class="form-select" required>
                                        <option value="">Select</option>
                                        <option>Cleaner</option>
                                        <option>Maid</option>
                                        <option>Cook</option>
                                        <option>Babysitter</option>
                                        <option>Driver</option>
                                        <option>Gardener</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Years of Experience</label>
                                    <input type="number" class="form-control" placeholder="5" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Skills</label>
                                <input type="text" class="form-control" placeholder="Cleaning, Cooking, Child Care">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Previous Work / Employer</label>
                                <input type="text" class="form-control" placeholder="Family A, Family B">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Expected Salary</label>
                                    <input type="text" class="form-control" placeholder="PKR 25,000" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Employment Type</label>
                                    <select class="form-select" required>
                                        <option>Full-time</option>
                                        <option>Part-time</option>
                                        <option>Live-in</option>
                                        <option>Live-out</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Availability -->
                            <h5 class="fw-bold mt-4">Availability</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Available From</label>
                                    <input type="date" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Preferred Working Hours</label>
                                    <input type="text" class="form-control" placeholder="9am - 5pm">
                                </div>
                            </div>

                            <!-- References -->
                            <h5 class="fw-bold mt-4">References</h5>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Reference Name</label>
                                    <input type="text" class="form-control" placeholder="Mr. Ahmed">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Phone</label>
                                    <input type="tel" class="form-control" placeholder="+92 300 1234567">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Relationship</label>
                                    <input type="text" class="form-control" placeholder="Previous Employer">
                                </div>
                            </div>

                            <!-- Documents -->
                            <h5 class="fw-bold mt-4">Additional Documents</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Profile Photo</label>
                                    <input type="file" class="form-control" accept="image/*">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Certificates</label>
                                    <input type="file" class="form-control" accept=".pdf,.jpg,.png">
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="form-check mb-3 mt-3">
                                <input class="form-check-input" type="checkbox" id="workerTerms" required>
                                <label class="form-check-label" for="workerTerms">I confirm all information is correct and agree to terms.</label>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Submit Registration</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/auth.js"></script>
</body>
</html>
