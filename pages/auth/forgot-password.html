<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm border-0 p-4">
                        <h2 class="text-center fw-bold mb-2">Forgot Password</h2>
                        <p class="text-center text-muted small mb-4">Enter your email to receive a reset link.</p>
                        <form id="forgotPasswordForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" id="resetEmail" placeholder="your@email.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Send Reset Link</button>
                        </form>
                        <p class="text-center mt-3 small"><a href="/pages/auth/login.html">Back to Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/auth.js"></script>
</body>
</html>
