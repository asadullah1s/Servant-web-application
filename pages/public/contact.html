<!-- MAIN CONTENT FOR contact.html -->
<section class="contact-page py-5">
    <div class="container">
        <h1 class="fw-bold text-center mb-4" data-i18n="nav_contact">Contact Us</h1>
        <div class="row g-5">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <form id="contactForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" data-i18n="full_name">Full Name</label>
                            <input type="text" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" placeholder="your@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" data-i18n="phone">Phone</label>
                            <input type="tel" class="form-control" placeholder="+92 300 1234567">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" data-i18n="message">Message</label>
                            <textarea class="form-control" rows="5" placeholder="Your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" data-i18n="send_message">Send Message</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4 shadow-sm h-100">
                    <h5><i class="fas fa-map-marker-alt text-primary me-2"></i> Address</h5>
                    <p>Karachi, Pakistan</p>
                    <h5><i class="fas fa-phone text-primary me-2"></i> Phone</h5>
                    <p>+92 300 1234567</p>
                    <h5><i class="fas fa-envelope text-primary me-2"></i> Email</h5>
                    <p>info@staffingplatform.com</p>
                    <h5><i class="fas fa-clock text-primary me-2"></i> Hours</h5>
                    <p>Mon - Sat: 9:00 AM - 6:00 PM</p>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.getElementById('contactForm')?.addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Thank you! Your message has been sent. (Demo)');
        this.reset();
    });
</script>
