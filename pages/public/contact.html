<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/public.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/rtl.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container">
            <h1 class="fw-bold text-center mb-4" data-i18n="nav_contact">Contact Us</h1>
            <div class="row g-5">
                <div class="col-md-6">
                    <div class="card p-4 shadow-sm border-0">
                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold" data-i18n="full_name">Full Name</label>
                                <input type="text" class="form-control" placeholder="Your Name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" placeholder="your@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" data-i18n="phone">Phone</label>
                                <input type="tel" class="form-control" placeholder="+92 300 1234567">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" data-i18n="message">Message</label>
                                <textarea class="form-control" rows="5" placeholder="Your message here..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" data-i18n="send_message">Send Message</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="contact-info-card">
                        <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <h6>Address</h6>
                        <p>Karachi, Pakistan</p>
                        <div class="contact-icon mt-3"><i class="fas fa-phone"></i></div>
                        <h6>Phone</h6>
                        <p>+92 300 1234567</p>
                        <div class="contact-icon mt-3"><i class="fas fa-envelope"></i></div>
                        <h6>Email</h6>
                        <p>info@staffingplatform.com</p>
                        <div class="contact-icon mt-3"><i class="fas fa-clock"></i></div>
                        <h6>Hours</h6>
                        <p>Mon - Sat: 9:00 AM - 6:00 PM</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('contactForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you! Your message has been sent. (Demo)');
            this.reset();
        });
    </script>
</body>
</html>
