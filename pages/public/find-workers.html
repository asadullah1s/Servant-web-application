<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Workers - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/public.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/rtl.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <h1 class="fw-bold text-center mb-4" data-i18n="nav_workers">Find Workers</h1>

            <!-- Filters -->
            <div class="card shadow-sm p-4 mb-4 filter-card">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="fw-semibold" data-i18n="search_service">Service</label>
                        <select class="form-select" id="filterService">
                            <option value="">All Categories</option>
                            <option value="Cleaner">Cleaner</option>
                            <option value="Maid">Maid</option>
                            <option value="Cook">Cook</option>
                            <option value="Babysitter">Babysitter</option>
                            <option value="Driver">Driver</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="fw-semibold" data-i18n="search_city">City</label>
                        <select class="form-select" id="filterCity">
                            <option value="">All Cities</option>
                            <option value="Karachi">Karachi</option>
                            <option value="Lahore">Lahore</option>
                            <option value="Islamabad">Islamabad</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="fw-semibold" data-i18n="search_experience">Experience</label>
                        <select class="form-select" id="filterExperience">
                            <option value="">Any</option>
                            <option value="1">1+ Year</option>
                            <option value="3">3+ Years</option>
                            <option value="5">5+ Years</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary w-100" id="applyFiltersBtn"><i class="fas fa-search me-2"></i> Search</button>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="row g-4" id="workersContainer">
                <!-- JS se dynamic render hoga -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/home.js"></script>
    <script>
        document.getElementById('applyFiltersBtn')?.addEventListener('click', function(e) {
            e.preventDefault();
            const service = document.getElementById('filterService').value;
            const city = document.getElementById('filterCity').value;
            const exp = document.getElementById('filterExperience').value;
            alert(`[Demo Filter]\nService: ${service || 'Any'}\nCity: ${city || 'Any'}\nExperience: ${exp || 'Any'} years`);
        });
    </script>
</body>
</html>
