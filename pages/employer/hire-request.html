<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Request - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 p-4">
                        <h3 class="fw-bold mb-4">Send Hiring Request</h3>
                        <form id="hireRequestForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Select Worker</label>
                                <select class="form-select" id="hireWorker" required>
                                    <option value="">Choose a worker</option>
                                    <option value="Fatima Noor">Fatima Noor (Maid)</option>
                                    <option value="Ahmed Khan">Ahmed Khan (Cook)</option>
                                    <option value="Usman Shah">Usman Shah (Driver)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Service Required</label>
                                <select class="form-select" required>
                                    <option>Cleaner</option>
                                    <option>Maid</option>
                                    <option>Cook</option>
                                    <option>Babysitter</option>
                                    <option>Driver</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Job Location</label>
                                    <input type="text" class="form-control" placeholder="Address" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Salary / Budget</label>
                                    <input type="text" class="form-control" placeholder="PKR 25,000" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Employment Type</label>
                                    <select class="form-select" required>
                                        <option>Full-time</option>
                                        <option>Part-time</option>
                                        <option>Live-in</option>
                                        <option>Live-out</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Start Date</label>
                                    <input type="date" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Working Hours</label>
                                <input type="text" class="form-control" placeholder="e.g. 9am - 5pm">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Additional Requirements</label>
                                <textarea class="form-control" rows="3" placeholder="Any special instructions..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Send Request</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/employer.js"></script>
</body>
</html>
