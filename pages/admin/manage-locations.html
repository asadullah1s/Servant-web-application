<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Locations - Admin - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 p-4">
                        <h4 class="fw-bold mb-3">Add Location (City & Area)</h4>
                        <form id="locationForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">City Name</label>
                                    <input type="text" class="form-control" id="cityName" placeholder="e.g. Karachi" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Area Name</label>
                                    <input type="text" class="form-control" id="areaName" placeholder="e.g. Gulshan" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add Location</button>
                        </form>
                        <hr>
                        <h5 class="fw-bold">Existing Locations (Demo)</h5>
                        <ul class="list-group">
                            <li class="list-group-item d-flex justify-content-between">Karachi - Gulshan <span class="text-danger" style="cursor:pointer;">Remove</span></li>
                            <li class="list-group-item d-flex justify-content-between">Lahore - Defence <span class="text-danger" style="cursor:pointer;">Remove</span></li>
                            <li class="list-group-item d-flex justify-content-between">Islamabad - F-10 <span class="text-danger" style="cursor:pointer;">Remove</span></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/admin.js"></script>
</body>
</html>
