<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4" id="adminDashboard">
        <div class="container">
            <h2 class="fw-bold mb-4">Admin Dashboard</h2>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-primary" id="totalWorkers">0</h4>
                        <p class="text-muted small">Total Workers</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-success" id="verifiedWorkers">0</h4>
                        <p class="text-muted small">Verified</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-warning" id="pendingVerification">0</h4>
                        <p class="text-muted small">Pending Verification</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-info" id="totalEmployers">0</h4>
                        <p class="text-muted small">Total Employers</p>
                    </div>
                </div>
            </div>

            <!-- Additional Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <div class="card p-3 shadow-sm">
                        <h6 class="fw-bold">Active Requests</h6>
                        <h3 class="text-primary" id="activeRequests">0</h3>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-3 shadow-sm">
                        <h6 class="fw-bold">Completed Hires</h6>
                        <h3 class="text-success" id="completedHires">0</h3>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card shadow-sm p-3">
                <h5 class="fw-bold mb-3">Quick Actions</h5>
                <div class="row g-2">
                    <div class="col-md-3">
                        <a href="/pages/admin/manage-workers.html" class="btn btn-outline-primary w-100">Manage Workers</a>
                    </div>
                    <div class="col-md-3">
                        <a href="/pages/admin/verifications.html" class="btn btn-outline-warning w-100">Verify Pending</a>
                    </div>
                    <div class="col-md-3">
                        <a href="/pages/admin/manage-categories.html" class="btn btn-outline-info w-100">Categories</a>
                    </div>
                    <div class="col-md-3">
                        <a href="/pages/admin/reports.html" class="btn btn-outline-secondary w-100">View Reports</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/admin.js"></script>
</body>
</html>
