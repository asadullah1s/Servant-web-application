<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4" id="employerDashboard">
        <div class="container">
            <h2 class="fw-bold mb-4">Employer Dashboard</h2>

            <!-- Stats Cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-primary" id="totalRequests">0</h4>
                        <p class="text-muted small">Total Requests</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-warning" id="pendingRequests">0</h4>
                        <p class="text-muted small">Pending</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-success" id="acceptedWorkers">0</h4>
                        <p class="text-muted small">Accepted / Completed</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-danger" id="favorites">0</h4>
                        <p class="text-muted small">Favorites</p>
                    </div>
                </div>
            </div>

            <!-- Recent Requests -->
            <div class="card shadow-sm p-3 mb-4">
                <h5 class="fw-bold mb-3">Recent Requests</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Worker</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recentRequestsTable">
                            <!-- JS se dynamic render hoga -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Favorites List -->
            <div class="card shadow-sm p-3">
                <h5 class="fw-bold mb-3">Favorite Workers</h5>
                <ul class="list-group" id="favoritesList">
                    <!-- JS se dynamic render hoga -->
                </ul>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/employer.js"></script>
</body>
</html>
