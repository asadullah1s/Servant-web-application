<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Worker - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 p-4">
                        <h3 class="fw-bold mb-4">My Documents</h3>
                        <p class="text-muted small">Upload required documents for verification. (Max 5MB each)</p>
                        <form id="documentsForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Profile Photo</label>
                                <input type="file" class="form-control doc-upload" accept="image/*" data-preview="photoPreview">
                                <small class="text-muted" id="photoPreview">No file selected</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">CNIC / ID Front</label>
                                <input type="file" class="form-control doc-upload" accept="image/*,.pdf" required data-preview="cnicFrontPreview">
                                <small class="text-muted" id="cnicFrontPreview">No file selected</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">CNIC / ID Back</label>
                                <input type="file" class="form-control doc-upload" accept="image/*,.pdf" required data-preview="cnicBackPreview">
                                <small class="text-muted" id="cnicBackPreview">No file selected</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Experience Certificates</label>
                                <input type="file" class="form-control doc-upload" accept=".pdf,.jpg,.png" data-preview="certPreview">
                                <small class="text-muted" id="certPreview">No file selected</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Other Documents</label>
                                <input type="file" class="form-control doc-upload" accept=".pdf,.jpg,.png" data-preview="otherPreview">
                                <small class="text-muted" id="otherPreview">No file selected</small>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Submit Documents for Verification</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/worker.js"></script>
</body>
</html>
