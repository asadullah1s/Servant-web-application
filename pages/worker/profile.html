<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Worker - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-sm border-0 p-4">
                        <h3 class="fw-bold mb-4">My Profile</h3>
                        <form id="workerProfileForm">
                            <!-- Personal -->
                            <h5 class="fw-bold">Personal Information</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <input type="text" class="form-control" value="Fatima Noor" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Father Name</label>
                                    <input type="text" class="form-control" value="Muhammad Khan" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Gender</label>
                                    <select class="form-select">
                                        <option>Female</option>
                                        <option>Male</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Date of Birth</label>
                                    <input type="date" class="form-control" value="1995-06-15">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Phone</label>
                                    <input type="tel" class="form-control" value="+92 300 1234567">
                                </div>
                            </div>

                            <!-- Professional -->
                            <h5 class="fw-bold mt-4">Professional Information</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Service Category</label>
                                    <select class="form-select">
                                        <option>Maid</option>
                                        <option>Cleaner</option>
                                        <option>Cook</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Years of Experience</label>
                                    <input type="number" class="form-control" value="4">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Skills</label>
                                <input type="text" class="form-control" value="Cleaning, Cooking, Child Care">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Expected Salary</label>
                                <input type="text" class="form-control" value="PKR 25,000">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Address</label>
                                <input type="text" class="form-control" value="Gulshan, Karachi">
                            </div>

                            <!-- Availability -->
                            <h5 class="fw-bold mt-4">Availability</h5>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="availabilityToggle" checked>
                                <label class="form-check-label" for="availabilityToggle">Currently Available for Work</label>
                                <span class="badge bg-success ms-2" id="availabilityStatus">Available</span>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/worker.js"></script>
</body>
</html>
