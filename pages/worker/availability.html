<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability - Worker - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 p-4">
                        <h3 class="fw-bold mb-4">Set Availability</h3>
                        <form id="availabilityForm">
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="availToggle" checked>
                                <label class="form-check-label fw-bold" for="availToggle">I am currently available for work</label>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Available From</label>
                                    <input type="date" class="form-control" value="2026-09-10" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Preferred Working Hours</label>
                                    <input type="text" class="form-control" value="9:00 AM - 5:00 PM">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Employment Type Preferred</label>
                                <select class="form-select">
                                    <option>Full-time</option>
                                    <option>Part-time</option>
                                    <option>Live-in</option>
                                    <option>Live-out</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Preferred Locations (Areas)</label>
                                <input type="text" class="form-control" placeholder="e.g. Gulshan, Clifton, Saddar">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Update Availability</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/worker.js"></script>
    
    <script>
        document.getElementById('availabilityForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            showToast('Availability updated successfully! (Demo)', 'success');
        });
    </script>
</body>
</html>
