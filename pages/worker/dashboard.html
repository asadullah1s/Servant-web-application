<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard - Staffing Platform</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="py-4" id="workerDashboard">
        <div class="container">
            <h2 class="fw-bold mb-4">Worker Dashboard</h2>

            <!-- Status Bar -->
            <div class="alert alert-info d-flex justify-content-between align-items-center">
                <span><strong>Verification Status:</strong> <span id="verificationStatus">Under Review</span></span>
                <span><strong>Profile Completion:</strong> <span id="profileCompletion">75%</span></span>
            </div>

            <!-- Stats Cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-primary" id="availableJobs">0</h4>
                        <p class="text-muted small">Available Jobs</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-warning" id="applicationsCount">0</h4>
                        <p class="text-muted small">Total Applications</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 shadow-sm text-center">
                        <h4 class="text-success" id="acceptedCount">0</h4>
                        <p class="text-muted small">Accepted / Hired</p>
                    </div>
                </div>
            </div>

            <!-- Recent Applications -->
            <div class="card shadow-sm p-3 mb-4">
                <h5 class="fw-bold mb-3">Recent Applications</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Employer</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTable">
                            <!-- JS se dynamic render hoga -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Available Jobs -->
            <div class="card shadow-sm p-3">
                <h5 class="fw-bold mb-3">Recommended Jobs</h5>
                <div class="row g-3" id="availableJobsContainer">
                    <!-- JS se dynamic render hoga -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>
    <div id="alerts-container"></div>
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/ur.js"></script>
    <script src="/js/i18n/ps.js"></script>
    <script src="/js/i18n/translations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages/worker.js"></script>
</body>
</html>
